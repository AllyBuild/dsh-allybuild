name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Suffix appended to the version tag (e.g. -tf1)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      # 主仓（sdk/ 所在地）在私有 Git 服务上，CI 拿不到——checkout 本仓到
      # runtime/ 子目录：Dockerfile 的 COPY 路径（runtime/* + sdk/*）正好
      # 以本 job 工作区为上下文根成立，sdk/ 由下一步从 registry 物化。
      - uses: actions/checkout@v4
        with:
          path: runtime

      - name: Materialize the released SDKs into the build context
        run: bash runtime/scripts/prepare-ci-sdk.sh

      # 上下文根的 ignore：web-minimal 的 node_modules/tests 与仓库元数据
      # 不进镜像（与主仓根 .dockerignore 的对应条目同义）。
      - name: Write the context .dockerignore
        run: |
          printf '%s\n' \
            'runtime/web-minimal/node_modules/' \
            'runtime/web-minimal/tests/' \
            'runtime/.git/' \
            'runtime/.github/' \
            'runtime/scripts/' \
            'runtime/example/' \
            > .dockerignore

      - name: Resolve lowercase image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve the dsh version this build pins
        id: dsh-version
        # 从 Dockerfile 钉定的 DSH_SOURCE_REF 取版本：npm latest 可能领先于
        # 钉定版本（tag 与镜像内 dsh 版本必须严格一致，README 契约）。
        # 追加短 commitid 区分同版本 overlay 变更的重构建（前端 .env 按
        # 此 tag 精确拉取，避免旧 tag 缓存/覆盖歧义）。
        run: |
          VERSION=$(sed -n 's/^ARG DSH_SOURCE_REF=dsh-v//p' runtime/Dockerfile)
          SHA=${GITHUB_SHA::7}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_sha=${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.ref }}
          # The dispatch suffix rides the semver route: {{version}} is not a
          # raw-value expression in metadata-action, and an empty suffix dedupes
          # into the plain {{version}} tag above, so push builds keep their tags.
          tags: |
            type=raw,value=${{ steps.dsh-version.outputs.version_sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},suffix=${{ inputs.tag_suffix || github.event.inputs.tag_suffix || '' }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CI 镜像 = released SDK 通道（prepare-ci-sdk.sh 从 npm/PyPI 物化）；
      # 本地/开发镜像 = source SDK 通道（主仓根构建）。两者 SDK 内容可能
      # 短暂不同步，dsh 与 overlay 部分始终一致（同一 Dockerfile）。
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Language-face smoke
        run: |
          docker run --rm --entrypoint sh ${{ steps.image.outputs.ref }}:${{ steps.dsh-version.outputs.version_sha }} -c '
            set -e
            python3 --version && tsx --version
            mkdir -p /tmp/fake-slot && cd /tmp/fake-slot
            printf "import { AllyBuildClient } from \"@allybuild/sdk\"\nconsole.log(\"ts-sdk-ok\", typeof AllyBuildClient)\n" > smoke.ts
            tsx smoke.ts
            tsx -e '"'"'import("@allybuild/sdk").then(m => console.log("ts-sdk-ok", Object.keys(m).length))'"'"'
            python3 -c "import allybuild_sdk; print(\"py-sdk-ok\")"
          '

      # 离线分发通道：ghcr 包 ACL 不含 Daytona 的拉取凭据时，用 artifact
      # 运镜像到本地再 `daytona snapshot push`（仅手动触发时导出）。
      - name: Export image artifact
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker buildx build \
            --output type=docker,dest=image.tar \
            --cache-from type=gha \
            -t ${{ steps.image.outputs.ref }}:${{ steps.dsh-version.outputs.version }} \
            -f runtime/Dockerfile \
            .
          zstd -T0 -19 image.tar -o image.tar.zst

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: dsh-image-${{ steps.dsh-version.outputs.version }}
          path: image.tar.zst
          retention-days: 7
